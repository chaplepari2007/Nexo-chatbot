<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NOVA - Study Space</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:
    Inter,
    Segoe UI,
    Arial,
    sans-serif;

    background:#11100f;

    color:#f5efe7;
}

button,
input{

    font:inherit;
}

.app{

    min-height:100vh;

    display:flex;

    flex-direction:column;
}


/* ---------------- HEADER ---------------- */

.topbar{

    height:68px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 22px;

    border-bottom:
    1px solid #292622;

    background:#141311;
}

.brand{

    display:flex;

    align-items:center;

    gap:11px;
}

.logo{

    width:36px;

    height:36px;

    display:grid;

    place-items:center;

    border-radius:10px;

    background:#e8a24a;

    color:#17130e;

    font-weight:900;

    font-size:20px;
}

.brand strong{

    font-size:20px;

    letter-spacing:.5px;
}

.brand span{

    display:block;

    color:#948b80;

    font-size:11px;

    margin-top:2px;
}

.status{

    display:flex;

    align-items:center;

    gap:7px;

    color:#a79e94;

    font-size:12px;
}

.dot{

    width:7px;

    height:7px;

    border-radius:50%;

    background:#78b982;
}


/* ---------------- CHAT ---------------- */

.chat{

    width:min(980px,94%);

    margin:auto;

    flex:1;

    padding:
    30px
    0
    130px;
}

.welcome{

    text-align:center;

    padding:
    65px
    15px
    30px;
}

.welcome h1{

    font-size:42px;

    margin:
    0
    0
    12px;
}

.welcome p{

    color:#a69d93;

    max-width:650px;

    margin:auto;

    line-height:1.6;
}


/* ---------------- MESSAGE ---------------- */

.message{

    display:flex;

    margin:
    22px
    0;
}

.message.user{

    justify-content:flex-end;
}

.bubble{

    max-width:min(820px,92%);

    border:
    1px solid #2c2925;

    background:#181613;

    border-radius:18px;

    padding:17px 18px;

    line-height:1.65;

    white-space:pre-wrap;
}

.user .bubble{

    background:#211c16;

    border-color:#473722;
}

.assistant .bubble{

    width:100%;
}


/* ---------------- IMAGE ---------------- */

.image-preview{

    max-width:330px;

    max-height:260px;

    border-radius:14px;

    margin-top:10px;

    border:
    1px solid #39332d;
}


/* ---------------- CARDS ---------------- */

.card{

    margin-top:14px;

    border:
    1px solid #302c27;

    border-radius:15px;

    background:#151412;

    overflow:hidden;
}

.card-title{

    display:flex;

    align-items:center;

    gap:9px;

    padding:13px 15px;

    border-bottom:
    1px solid #292621;

    color:#e8a24a;

    font-weight:700;
}

.card-body{

    padding:15px;

    color:#ddd5cc;

    line-height:1.65;

    white-space:pre-wrap;
}


/* ---------------- COMPOSER ---------------- */

.composer-wrap{

    position:fixed;

    left:0;

    right:0;

    bottom:0;

    padding:15px;

    background:
    linear-gradient(
        transparent,
        #11100f 28%
    );
}

.composer{

    width:min(980px,94%);

    margin:auto;

    background:#181613;

    border:
    1px solid #37312a;

    border-radius:18px;

    display:flex;

    align-items:center;

    padding:9px;

    gap:8px;

    box-shadow:
    0 12px 40px #0008;
}

.composer input{

    flex:1;

    min-width:0;

    background:transparent;

    border:0;

    outline:0;

    color:#f5efe7;

    padding:
    12px
    8px;
}

.icon-btn{

    width:42px;

    height:42px;

    border:0;

    border-radius:12px;

    background:transparent;

    color:#aaa198;

    cursor:pointer;

    display:grid;

    place-items:center;
}

.icon-btn:hover{

    background:#28231e;

    color:#e8a24a;
}

.send{

    background:#e8a24a;

    color:#17130e;
}

.send:hover{

    background:#f0b25d;

    color:#17130e;
}

input[type=file]{

    display:none;
}


/* ---------------- TYPING ---------------- */

.typing{

    display:inline-flex;

    gap:4px;

    padding:8px 2px;
}

.typing i{

    width:6px;

    height:6px;

    border-radius:50%;

    background:#e8a24a;

    animation:
    typing 1s infinite alternate;
}

.typing i:nth-child(2){

    animation-delay:.2s;
}

.typing i:nth-child(3){

    animation-delay:.4s;
}

@keyframes typing{

    to{

        opacity:.25;

        transform:
        translateY(-3px);
    }
}


/* ---------------- TOAST ---------------- */

.toast{

    position:fixed;

    top:80px;

    left:50%;

    transform:
    translateX(-50%);

    background:#2a2118;

    color:#f5e6d2;

    border:
    1px solid #5b452d;

    padding:
    12px
    16px;

    border-radius:12px;

    display:none;

    z-index:100;

    max-width:90%;
}


/* ---------------- MOBILE ---------------- */

@media(max-width:600px){

    .welcome h1{

        font-size:32px;
    }

    .chat{

        padding-top:10px;
    }

    .status{

        display:none;
    }

    .composer{

        width:96%;
    }
}

</style>

</head>


<body>


<div class="app">


<!-- HEADER -->

<header class="topbar">

    <div class="brand">

        <div class="logo">
            N
        </div>

        <div>

            <strong>NOVA</strong>

            <span>
                study space
            </span>

        </div>

    </div>


    <div class="status">

        <span class="dot"></span>

        <span id="statusText">
            Checking...
        </span>

    </div>

</header>



<!-- CHAT -->

<main
    id="chat"
    class="chat"
>


<section
    id="welcome"
    class="welcome"
>

    <h1>
        What are you learning?
    </h1>

    <p>

        Ask NOVA anything.

        Solve problems,
        understand concepts,
        write programs,

        or upload a question,
        code screenshot
        or engineering diagram.

    </p>

</section>

</main>



<!-- TOAST -->

<div
    id="toast"
    class="toast"
></div>



<!-- COMPOSER -->

<div class="composer-wrap">

<div class="composer">


<!-- IMAGE BUTTON -->

<button
    class="icon-btn"
    id="imageBtn"
    title="Upload image"
>

    <i
        data-lucide="image"
    ></i>

</button>


<!-- REAL FILE INPUT -->

<input
    id="imageInput"
    type="file"
    accept="
        image/png,
        image/jpeg,
        image/jpg,
        image/webp,
        image/gif
    "
>


<!-- VOICE -->

<button
    class="icon-btn"
    id="voiceBtn"
    title="Voice input"
>

    <i
        data-lucide="mic"
    ></i>

</button>


<!-- TEXT -->

<input
    id="messageInput"
    autocomplete="off"
    placeholder="Ask NOVA anything..."
>


<!-- SEND -->

<button
    class="icon-btn send"
    id="sendBtn"
    title="Send"
>

    <i
        data-lucide="arrow-up"
    ></i>

</button>


</div>

</div>


<script>


/* ---------------- ICONS ---------------- */

lucide.createIcons();



/* ---------------- ELEMENTS ---------------- */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const imageBtn =
    document.getElementById("imageBtn");

const imageInput =
    document.getElementById("imageInput");

const voiceBtn =
    document.getElementById("voiceBtn");

const welcome =
    document.getElementById("welcome");

const toast =
    document.getElementById("toast");

const statusText =
    document.getElementById("statusText");



/* ---------------- TOAST ---------------- */

function showToast(message){

    toast.textContent = message;

    toast.style.display =
        "block";

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () => {

                toast.style.display =
                    "none";

            },
            5000
        );
}



/* ---------------- ADD MESSAGE ---------------- */

function addMessage(
    role,
    text,
    imageSrc=null
){

    welcome.style.display =
        "none";

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message " + role;


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    if(text){

        bubble.textContent =
            text;

    }


    if(imageSrc){

        const img =
            document.createElement(
                "img"
            );

        img.src =
            imageSrc;

        img.className =
            "image-preview";

        bubble.appendChild(
            document.createElement(
                "br"
            )
        );

        bubble.appendChild(img);

    }


    row.appendChild(
        bubble
    );

    chat.appendChild(
        row
    );


    window.scrollTo({

        top:
            document.body.scrollHeight,

        behavior:
            "smooth"

    });

}



/* ---------------- TYPING ---------------- */

function addTyping(){

    welcome.style.display =
        "none";


    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message assistant";

    row.id =
        "typing";


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    bubble.innerHTML = `

        <span class="typing">

            <i></i>
            <i></i>
            <i></i>

        </span>

    `;


    row.appendChild(
        bubble
    );

    chat.appendChild(
        row
    );

}


/* ---------------- ANSWER ---------------- */

function addAnswer(text){

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message assistant";


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    bubble.textContent =
        text;


    row.appendChild(
        bubble
    );

    chat.appendChild(
        row
    );


    window.scrollTo({

        top:
            document.body.scrollHeight,

        behavior:
            "smooth"

    });

}



/* ---------------- REMOVE TYPING ---------------- */

function removeTyping(){

    const typing =
        document.getElementById(
            "typing"
        );

    if(typing){

        typing.remove();

    }

}



/* ---------------- TEXT CHAT ---------------- */

async function sendMessage(){

    const message =
        input.value.trim();


    if(!message){

        return;

    }


    addMessage(
        "user",
        message
    );


    input.value = "";


    addTyping();


    try{

        const response =
            await fetch(
                "/chat",
                {

                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:
                                message
                        })

                }
            );


        const data =
            await response.json();


        removeTyping();


        if(!response.ok){

            showToast(
                data.error ||
                "Something went wrong."
            );

            addAnswer(
                data.error ||
                "Something went wrong."
            );

            return;

        }


        addAnswer(
            data.response ||
            "NOVA did not return an answer."
        );


    }
    catch(error){

        removeTyping();


        const message =
            "Could not connect to NOVA. Make sure app.py is running.";

        showToast(message);

        addAnswer(message);

    }

}



/* ---------------- IMAGE BUTTON ---------------- */

imageBtn.addEventListener(
    "click",
    function(){

        /*
        THIS IS THE IMPORTANT FIX.

        Instead of showing:
        "Images question support can be connected here next"

        it opens the real file picker.
        */

        imageInput.click();

    }
);



/* ---------------- IMAGE SELECTED ---------------- */

imageInput.addEventListener(
    "change",
    function(){

        const file =
            imageInput.files[0];


        if(!file){

            return;

        }


        uploadImage(file);


        /*
        Reset input so the same
        image can be selected again.
        */

        imageInput.value = "";

    }
);



/* ---------------- IMAGE UPLOAD ---------------- */

async function uploadImage(file){

    const allowedTypes = [

        "image/png",
        "image/jpeg",
        "image/jpg",
        "image/webp",
        "image/gif"

    ];


    if(
        !allowedTypes.includes(
            file.type
        )
    ){

        showToast(
            "Please select PNG, JPG, JPEG, WEBP or GIF."
        );

        return;

    }


    if(
        file.size >
        8 * 1024 * 1024
    ){

        showToast(
            "Image must be smaller than 8 MB."
        );

        return;

    }


    /*
    Show selected image
    immediately in chat.
    */

    const previewURL =
        URL.createObjectURL(
            file
        );


    addMessage(
        "user",
        "Analyze this image",
        previewURL
    );


    /*
    FormData sends the actual
    image file to Flask.
    */

    const formData =
        new FormData();


    formData.append(
        "image",
        file
    );


    addTyping();


    try{

        const response =
            await fetch(
                "/vision",
                {

                    method:
                        "POST",

                    body:
                        formData

                }
            );


        const data =
            await response.json();


        removeTyping();


        if(!response.ok){

            showToast(
                data.error ||
                "Image analysis failed."
            );

            addAnswer(
                data.error ||
                "Image analysis failed."
            );

            return;

        }


        addAnswer(
            data.response ||
            "I could not understand the image."
        );


    }
    catch(error){

        removeTyping();


        const msg =
            "Image analysis failed. Check that Ollama and the vision model are running.";


        showToast(msg);

        addAnswer(msg);

    }

}



/* ---------------- SEND BUTTON ---------------- */

sendBtn.addEventListener(
    "click",
    sendMessage
);



/* ---------------- ENTER KEY ---------------- */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
            &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);



/* ---------------- VOICE ---------------- */

if(
    "webkitSpeechRecognition"
    in window
    ||
    "SpeechRecognition"
    in window
){

    const SpeechRecognition =
        window.SpeechRecognition
        ||
        window.webkitSpeechRecognition;


    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-IN";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    voiceBtn.addEventListener(
        "click",
        function(){

            try{

                recognition.start();

                showToast(
                    "Listening..."
                );

            }
            catch(error){

            }

        }
    );


    recognition.onresult =
        function(event){

            input.value =
                event
                .results[0][0]
                .transcript;

        };


    recognition.onerror =
        function(){

            showToast(
                "Voice input could not start."
            );

        };

}
else{

    voiceBtn.addEventListener(
        "click",
        function(){

            showToast(
                "Voice input is not supported by this browser."
            );

        }
    );

}



/* ---------------- HEALTH CHECK ---------------- */

async function checkHealth(){

    try{

        const response =
            await fetch(
                "/health"
            );


        const data =
            await response.json();


        if(!data.ollama){

            statusText.textContent =
                "Ollama offline";

        }

        else if(
            !data.vision_model
        ){

            statusText.textContent =
                "Text AI ready • Image AI needs model";

        }

        else{

            statusText.textContent =
                "Local • Text + Image AI ready";

        }

    }
    catch(error){

        statusText.textContent =
            "Flask running";

    }

}


checkHealth();


</script>

</body>

</html>
